[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "credsclaw"
version = "0.1.0"
description = "CredsClaw — async CLI to scan GitHub repositories, local directories, or git history for exposed API keys and secrets"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["security", "audit", "api-keys", "secrets", "github"]

authors = [
    {name = "Tedz"},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "aiohttp>=3.9.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "aioresponses>=0.7.6",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
credsclaw = "auditor.__main__:main"
auditor = "auditor.__main__:main"
[tool.setuptools.packages.find]
include = ["auditor*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=auditor --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"auditor/__init__.py" = ["E402"]
"auditor/__main__.py" = ["E402"]
"auditor/rate_limiter.py" = ["SIM105"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "auditor.config"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "auditor.exporter"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "auditor.scanner"
disallow_untyped_defs = false
